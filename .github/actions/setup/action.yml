name: Setup pnpm workspace
description: Node 22 (from .nvmrc) + pnpm (from packageManager) + pnpm store cache + turbo cache + install

inputs:
  install:
    description: Run pnpm install --frozen-lockfile
    required: false
    default: 'true'
  turbo-cache-key:
    description: Extra discriminator for the turbo cache key (usually the job name)
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      # Version is read from "packageManager" in package.json.

    - name: Install Node
      uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Restore turbo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.turbo-cache-key }}-
          turbo-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
