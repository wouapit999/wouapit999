name: ResidenceFlow CI

on:
  push:
    paths: ["residenceflow/**", ".github/workflows/residenceflow-ci.yml"]
  pull_request:
    paths: ["residenceflow/**", ".github/workflows/residenceflow-ci.yml"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: residenceflow
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: residenceflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/residenceflow_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/residenceflow_test
      AUTH_SECRET: ci-secret
      CRON_SECRET: ci-cron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: residenceflow/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - name: Migration drift check
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow --exit-code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
