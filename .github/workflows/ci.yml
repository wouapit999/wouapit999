name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  TURBO_CACHE_DIR: .turbo/cache
  # Optional Vercel remote cache; unset secrets are harmless.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: lint
      - name: ESLint (all workspaces)
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: typecheck
      - name: tsc --noEmit (all workspaces)
        run: pnpm typecheck

  test:
    name: Test (unit + e2e, Phase 1 workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: birem
          POSTGRES_PASSWORD: birem
          POSTGRES_DB: birem
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U birem -d birem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://birem:birem@localhost:5432/birem?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-0123456789abcdef
      ENCRYPTION_KEY: Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5MGFiY2RlZmdoaWo=
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_NAME: BI-Rem
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: test
      - name: Prisma generate
        run: pnpm db:generate
      - name: Apply migrations to the CI database
        run: pnpm db:migrate
      # BI-Rem Lite is self-contained (own schema, own database, own secrets): its tests and
      # end-to-end suite run in the dedicated "lite" job below, not with this job's environment.
      - name: Unit tests
        run: pnpm exec turbo run test --filter='!@bi-rem/lite'
      - name: End-to-end tests
        run: pnpm exec turbo run test:e2e --filter='!@bi-rem/lite'
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
            !apps/lite/coverage
          if-no-files-found: ignore
          retention-days: 7

  lite:
    # BI-Rem Lite (apps/lite): the same steps a Vercel deployment runs, then every check, on
    # PostgreSQL 16 (what a new Neon project runs). Deployment itself is done by Vercel's Git
    # integration on push — see apps/lite/DEPLOY.md; there is deliberately no deploy workflow.
    name: BI-Rem Lite (deploy rehearsal, lint, typecheck, test, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: birem
          POSTGRES_PASSWORD: birem
          POSTGRES_DB: birem_lite
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U birem -d birem_lite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The database a deployment would use. Vitest and Playwright never touch it: they create
      # and drop their own databases through TEST_DATABASE_ADMIN_URL.
      DATABASE_URL: postgresql://birem:birem@localhost:5432/birem_lite
      DATABASE_URL_UNPOOLED: postgresql://birem:birem@localhost:5432/birem_lite
      TEST_DATABASE_ADMIN_URL: postgresql://birem:birem@localhost:5432/postgres
      # `pnpm test` skips the database-backed suites when no server is reachable; here that
      # must be a failure, never a green run.
      REQUIRE_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'false'
          turbo-cache-key: lite
      - name: Install exactly what Vercel installs (apps/lite/vercel.json installCommand)
        working-directory: apps/lite
        # The literal command is repeated here so that a change to vercel.json fails this job
        # until the rehearsal below is updated with it.
        run: |
          test "$(node -p "require('./vercel.json').installCommand")" = "pnpm install --frozen-lockfile --filter @bi-rem/lite..."
          test "$(node -p "require('./vercel.json').buildCommand")" = "pnpm run vercel-build"
          pnpm install --frozen-lockfile --filter @bi-rem/lite...
      - name: Prisma validate and generate
        run: |
          pnpm --filter @bi-rem/lite exec prisma validate
          pnpm --filter @bi-rem/lite generate
      - name: Apply migrations to an empty database (prisma migrate deploy)
        run: |
          pnpm --filter @bi-rem/lite migrate:deploy
          pnpm --filter @bi-rem/lite exec prisma migrate status
      - name: Lint
        run: pnpm --filter @bi-rem/lite lint
      - name: Typecheck
        run: pnpm --filter @bi-rem/lite typecheck
      - name: Unit and integration tests (vitest, real PostgreSQL)
        run: pnpm --filter @bi-rem/lite test
      - name: Rehearse the Vercel build as a production deployment (vercel-build)
        # sync-roadmap -> prisma generate -> prisma migrate deploy -> seed -> next build, with
        # throw-away secrets generated the way DEPLOY.md tells an operator to generate them.
        env:
          VERCEL: '1'
          VERCEL_ENV: production
          SEED_ADMIN_EMAIL: ci-admin@example.com
          SEED_DEMO_DATA: 'true'
        run: |
          AUTH_SECRET="$(openssl rand -base64 48)"
          ENCRYPTION_KEY="$(openssl rand -base64 32)"
          SEED_ADMIN_PASSWORD="$(openssl rand -base64 24)"
          export AUTH_SECRET ENCRYPTION_KEY SEED_ADMIN_PASSWORD
          pnpm --filter @bi-rem/lite run vercel-build
          echo "::group::Second deploy on the same database: nothing to migrate, seed is a no-op"
          pnpm --filter @bi-rem/lite migrate:deploy
          pnpm --filter @bi-rem/lite seed
          echo "::endgroup::"
      - name: Serverless bundle carries the Prisma client and its query compiler
        # Vercel packages each function from Next's file trace. If the generated client's
        # runtime is missing from it, every database call fails at run time, not at build time.
        run: |
          trace=apps/lite/.next/server/app/api/health/route.js.nft.json
          test -f "$trace"
          grep -q '@prisma/client/runtime/client' "$trace"
          grep -q 'query_compiler.*postgresql' "$trace"
          grep -q '/pg/lib/' "$trace"
      - name: Install Chromium (CI only; developer machines keep their own browser)
        run: pnpm --filter @bi-rem/lite exec playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, against the build made above)
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm --filter @bi-rem/lite test:e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lite-test-results
          path: |
            apps/lite/coverage
            apps/lite/test-results
          if-no-files-found: ignore
          retention-days: 7

  prisma:
    name: Prisma schema & migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: birem
          POSTGRES_PASSWORD: birem
          POSTGRES_DB: birem
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U birem -d birem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://birem:birem@localhost:5432/birem
      SHADOW_DATABASE_URL: postgresql://birem:birem@localhost:5432/birem_shadow
    defaults:
      run:
        working-directory: packages/db
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: prisma
      - name: Create shadow database
        run: docker exec "${{ job.services.postgres.id }}" psql -U birem -d birem -v ON_ERROR_STOP=1 -c 'CREATE DATABASE birem_shadow'
      - name: prisma validate
        run: pnpm exec prisma validate
      - name: prisma format --check
        run: pnpm exec prisma format --check
      - name: Migrations must reproduce schema.prisma exactly
        # Prisma 7 dropped --shadow-database-url; the shadow database comes from
        # infra/ci/prisma.config.ts (datasource.shadowDatabaseUrl). Exit code 2 means the
        # migrations folder and the datamodel drifted apart: someone edited schema.prisma
        # without `prisma migrate dev --create-only`.
        run: |
          pnpm exec prisma migrate diff \
            --config ../../infra/ci/prisma.config.ts \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
      - name: Migrations apply cleanly from scratch
        run: pnpm exec prisma migrate deploy && pnpm exec prisma migrate status
      - name: Migration lock provider is postgresql
        run: grep -q 'provider = "postgresql"' prisma/migrations/migration_lock.toml

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: https://api.staging.bi-rem.africa
      NEXT_PUBLIC_APP_NAME: BI-Rem
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: build
      - name: Build all workspaces
        run: pnpm build
      - name: Verify runtime contracts
        run: |
          test -f apps/api/dist/main.js
          test -f apps/web/.next/standalone/apps/web/server.js
          test -f apps/admin/.next/standalone/apps/admin/server.js

  infra:
    name: Infra lint (Dockerfiles, shell, workflows, compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: hadolint
        # Run the pinned hadolint image directly so the file list is explicit (the action's
        # glob handling differs between recursive and non-recursive modes).
        # DL3018/DL3016: apk/npm versions are pinned through build args, which hadolint cannot see.
        run: |
          for f in infra/docker/*.Dockerfile; do
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint \
              --failure-threshold warning --ignore DL3018 --ignore DL3016 - < "$f"
            echo "::endgroup::"
          done
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./infra
          severity: warning
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color
      - name: docker compose config
        run: docker compose -f infra/docker/docker-compose.yml --profile apps config --quiet
      - name: docker build --check
        run: |
          for f in infra/docker/*.Dockerfile; do
            echo "::group::$f"
            docker build --check -f "$f" .
            echo "::endgroup::"
          done
      - name: terraform fmt
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -diff -recursive infra/terraform

  docs-check:
    name: Docs check (Mermaid render, links, phase dates, sections)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # pnpm 10 does not run puppeteer's postinstall; Chrome comes from setup-chrome below.
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: docs-check
      - name: Install Chrome for mermaid-cli
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: pnpm docs:check
        # check-docs.mjs reads CHROME_PATH / PUPPETEER_EXECUTABLE_PATH for the mmdc browser.
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm docs:check

  ci-ok:
    # Single required status check for branch protection: "CI / ci-ok".
    name: ci-ok
    if: always()
    needs: [lint, typecheck, test, lite, prisma, build, infra, docs-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate upstream jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | map(select(.value.result != "success")) | length > 0' >/dev/null; then
            echo "::error::One or more CI jobs did not succeed"
            exit 1
          fi
