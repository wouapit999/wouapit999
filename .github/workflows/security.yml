name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: GPL-3.0-only, AGPL-3.0-only, SSPL-1.0

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for organisation-owned repositories only (free for personal accounts).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_SUMMARY: true

  audit:
    name: pnpm audit (report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'false'
          turbo-cache-key: audit
      - name: pnpm audit --prod (high and above)
        # Reporting only: advisories without a fix would otherwise block every PR. Dependabot
        # and dependency-review enforce the blocking policy.
        continue-on-error: true
        run: |
          set +e
          pnpm audit --prod --audit-level high --json > audit.json
          status=$?
          {
            echo "## pnpm audit (production dependencies, high+)"
            echo
            if [ "$status" -eq 0 ]; then
              echo "No high or critical advisories."
            else
              jq -r '
                .advisories // {} | to_entries[] | .value |
                "- **\(.severity)** \(.module_name) \(.vulnerable_versions) — \(.title) (\(.url))"
              ' audit.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pnpm-audit
          path: audit.json
          retention-days: 14

  trivy-image:
    name: Trivy scan (api image)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build api image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          load: true
          tags: bi-rem-api:scan
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Trivy (SARIF for the Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bi-rem-api:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event.pull_request.head.repo.fork != true
        with:
          sarif_file: trivy.sarif
          category: trivy-api-image
      - name: Trivy (fail on fixed CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bi-rem-api:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
